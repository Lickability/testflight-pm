name: Linear feedback tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned runtime
        run: npm install --prefix "$RUNNER_TEMP/testflight-pm-runtime" --ignore-scripts @oven/bun-linux-x64@1.3.0
      - name: Test and bundle Linear entrypoint
        run: |
          "$RUNNER_TEMP/testflight-pm-runtime/node_modules/@oven/bun-linux-x64/bin/bun" install --frozen-lockfile --ignore-scripts
          "$RUNNER_TEMP/testflight-pm-runtime/node_modules/@oven/bun-linux-x64/bin/bun" test linear/regression.test.ts
          "$RUNNER_TEMP/testflight-pm-runtime/node_modules/@oven/bun-linux-x64/bin/bun" build linear/run.ts --target=bun --outfile="$RUNNER_TEMP/testflight-linear.js"
